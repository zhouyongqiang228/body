name: 部署人体解剖图谱中文版

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 检查类型与解剖数据
        run: |
          npm run check
          npm run validate:atlas
          npm run validate:interactions
      - name: 安装浏览器测试环境
        run: npx playwright install --with-deps chromium
      - name: 验证浏览器交互
        run: npm run test:e2e
        env:
          GITHUB_REPOSITORY: ''
      - name: 保存浏览器测试结果
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
      - name: 构建静态网站
        run: npm run build
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传网站构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
